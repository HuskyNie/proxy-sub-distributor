services:
  fib-sub-sync:
    volumes:
      - "${KITTY_RUNTIME_DIR:?Set KITTY_RUNTIME_DIR}:/run/kitty:ro"

  kitty-browser:
    build:
      context: ./kitty-browser
      args:
        KITTY_BROWSER_IMAGE: "${KITTY_BROWSER_IMAGE:-ghcr.io/linuxserver/chromium:latest}"
    restart: unless-stopped
    shm_size: 1gb
    environment:
      PUID: "${KITTY_PUID:-1026}"
      PGID: "${KITTY_PGID:-100}"
      TZ: Asia/Shanghai
      UMASK: "077"
      CHROME_CLI: --remote-debugging-port=9222 --user-data-dir=/config/kitty-profile https://kitty.fo/dashboard
      KITTY_SUBSCRIPTION_HOSTS: "${KITTY_SUBSCRIPTION_HOSTS:-m1.tohno-2.top}"
      KITTY_SOCKET_PATH: /run/kitty/subscription.sock
    volumes:
      - "${KITTY_PROFILE_DIR:?Set KITTY_PROFILE_DIR}:/config"
      - "${KITTY_RUNTIME_DIR:?Set KITTY_RUNTIME_DIR}:/run/kitty"
