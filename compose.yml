services:
  proxy-sub-distributor:
    build: .
    image: proxy-sub-distributor:latest
    container_name: proxy-sub-distributor
    restart: unless-stopped
    ports:
      - "7899:7899"
    environment:
      CONFIG_PATH: /app/data/config.json
      DATA_DIR: /app/data
      STRATEGY_CONFIG_PATH: /app/data/clash-strategies.json
    volumes:
      - ./data:/app/data
